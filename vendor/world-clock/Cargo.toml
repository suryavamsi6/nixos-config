[package]
name = "serpantinum-world-clock-backend"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Stateless time and city search helper for the Serpantinum World Clock"

[[bin]]
name = "serpantinum-world-clock-backend"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["clock", "serde"] }
chrono-tz = "0.10"
deunicode = "1.6"
iana-time-zone = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
urlencoding = "2.1"

[dev-dependencies]
tempfile = "3.14"
